name: Report a problem
description: Something in BlogDraft Studio doesn't work
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! In the app, click **Report a problem** (bottom left) → **Copy report**, and paste it below.
        The report never contains your API keys or passwords. Please don't paste keys here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you click, and what did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom left of the app, e.g. 3.1
  - type: textarea
    id: report
    attributes:
      label: Problem report from the app
      description: Paste the copied report here.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag a screenshot into this box.
