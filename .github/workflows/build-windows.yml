# Builds the Windows .exe on GitHub (free) every time the code on "main" changes, and puts it in a
# GitHub Release named after APP_VERSION in core/config.py (for example v3.0). Raise the version for a new release.
name: Build Windows app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m unittest discover tests
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from core import config; print(config.APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "BlogDraft Studio" --icon app.ico --add-data "web;web" server.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/BlogDraft-Studio | Out-Null
          Copy-Item "dist/BlogDraft Studio.exe" release/BlogDraft-Studio/
          Copy-Item -Recurse wp-plugin release/BlogDraft-Studio/
          Copy-Item README.md release/BlogDraft-Studio/
          Compress-Archive -Path release/BlogDraft-Studio/* -DestinationPath release/BlogDraft-Studio-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BlogDraft-Studio-Windows
          path: release/BlogDraft-Studio-Windows.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BlogDraft Studio v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/BlogDraft-Studio-Windows.zip
          overwrite_files: true
          body: |
            Download **BlogDraft-Studio-Windows.zip**, extract it and double-click **BlogDraft Studio.exe**.
            The WordPress plugin is in the `wp-plugin` folder. Setup help is inside the app (Setup Guide).
