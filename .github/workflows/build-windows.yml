# Builds the Windows .exe on GitHub (free) every time the code on "main" changes, and puts it in a
# GitHub Release named after APP_VERSION in core/config.py (for example v3.0). Raise the version for a new release.
name: Build Windows app
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Test
        run: python -m unittest discover tests
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from core import config; print(config.APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build exe
        run: |
          python tools/version_file.py
          pyinstaller --noconfirm --clean --onedir --windowed --name "BlogDraft Studio" --icon app.ico --version-file version_info.txt --add-data "web;web" server.py
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/BlogDraft-Studio | Out-Null
          Copy-Item -Recurse "dist/BlogDraft Studio/*" release/BlogDraft-Studio/
          Copy-Item -Recurse wp-plugin release/BlogDraft-Studio/
          Copy-Item README.md, LICENSE, "HOW TO START.txt" release/BlogDraft-Studio/
          Compress-Archive -Path release/BlogDraft-Studio/* -DestinationPath release/BlogDraft-Studio-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: BlogDraft-Studio-Windows
          path: release/BlogDraft-Studio-Windows.zip
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BlogDraft Studio v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/BlogDraft-Studio-Windows.zip
          overwrite_files: true
          body: |
            1. Download **BlogDraft-Studio-Windows.zip** and **extract all** (right-click → Extract All). Don't run it from inside the zip.
            2. Open the folder and double-click **BlogDraft Studio.exe**.
            3. If Windows shows "Windows protected your PC": click **More info** → **Run anyway**. The app is open source and not code-signed yet.

            The WordPress plugin is in the `wp-plugin` folder. Setup help is inside the app (Setup Guide).

            ---
            **Urdu:** zip download karein, right-click → Extract All. Folder mein **BlogDraft Studio.exe** chalayein.
            "Windows protected your PC" aaye to **More info** → **Run anyway** dabayein.
